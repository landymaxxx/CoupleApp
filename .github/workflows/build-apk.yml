name: Build Android APK

on:
  push:
    branches:
      - development
  workflow_dispatch:

# Tối ưu RAM cho Gradle & Bật Build Cache
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js + Cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Cài đặt dependencies (Đưa lên trước để chuẩn bị môi trường JS)
      - name: Install dependencies
        run: npm ci

      # 4. Cài đặt Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Cài đặt Android SDK (đã tự chấp nhận licenses, không cần bước thủ công nữa)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 6. Prebuild để sinh ra thư mục native /android
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # 7. Cache ccache để tái sử dụng object file đã compile của native code
      #    (Reanimated, Worklets, expo-modules-core...) giữa các lần build
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-android
          max-size: 500M

      # 8. Khởi tạo & Cache Gradle
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # 9. Cấp quyền thực thi cho gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 10. Build APK release (Thêm --no-daemon để tiết kiệm RAM trên CI)
      - name: Build Android Release APK
        env:
          NDK_CCACHE: ccache
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalRelease \
            --no-daemon \
            --build-cache

      # 11. Upload file APK kết quả
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: android/app/build/outputs/apk/release/*.apk