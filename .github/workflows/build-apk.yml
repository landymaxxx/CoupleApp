name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js + Cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Cài đặt Java JDK (Dùng temurin để tận dụng Java pre-installed sẵn trên GitHub Runner)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Tự động Cache Gradle (Tăng tốc vượt trội từ lần build thứ 2)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      # 5. Duyệt License Android SDK siêu tốc (Thay thế cho android-actions/setup-android bị chậm)
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "2433373574b44d5d828864828680b92a1e065f4f" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a578f447d11500a00d13887030f" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "2433373574b44d5d828864828680b92a1e065f4f" > $ANDROID_HOME/licenses/android-sdk-preview-license

      # 6. Cài đặt dependencies (Dùng npm ci thay vì npm install để cài sạch & nhanh hơn trên CI)
      - name: Install dependencies
        run: npm ci

      # 7. Prebuild Android project
      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      # 8. Cấp quyền thực thi cho gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 9. Build APK - CHỈ biên dịch cho chip arm64-v8a (Thêm --no-daemon để tối ưu tài nguyên CI)
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      # 10. Upload file APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: android/app/build/outputs/apk/release/*.apk