name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Tối ưu RAM cho Gradle & Bật Build Cache
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy source code từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js & Cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Cài đặt JS Dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Cài đặt Java JDK 17
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Cài đặt Android SDK chuẩn (Thay thế cho lệnh thủ công bị lỗi kẹt log)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 6. Setup & Cache Gradle (Đưa lên trước prebuild để tối ưu)
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # 7. Tạo file google-services.json từ GitHub Secret
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > google-services.json
            echo "Successfully created google-services.json"
          else
            echo "Warning: GOOGLE_SERVICES_JSON secret is empty!"
          fi

      # 8. Prebuild để tạo thư mục native /android (Expo sẽ tự đưa google-services.json vào đúng chỗ)
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # 9. Setup ccache tối ưu thời gian compile C++/Native modules
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ runner.os }}-ccache-android
          max-size: 500M

      # 10. Cấp quyền thực thi cho gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 11. Build file APK Release (Chỉ build kiến trúc arm64-v8a)
      - name: Build Android Release APK
        env:
          NDK_CCACHE: ccache
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalRelease \
            --no-daemon \
            --build-cache

      # 12. Upload file APK sau khi build thành công
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: android/app/build/outputs/apk/release/*.apk