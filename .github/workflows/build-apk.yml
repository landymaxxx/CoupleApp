name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Tối ưu RAM cho Gradle & Bật Build Cache
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Đã hạ về 20 LTS - Bản ổn định nhất cho React Native/Expo hiện tại
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4 # Cập nhật lên v4 chuẩn nhất hiện tại
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4 # Cập nhật lên v4

      - name: 🏗️ Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: ⚡ Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-android
          max-size: 500M

      - name: 🔨 Build Android Release APK
        env:
          NDK_CCACHE: ccache
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalRelease \
            --no-daemon

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7 # Tự động xóa file trên GitHub sau 7 ngày để đỡ tốn dung lượng