name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Tối ưu RAM cho Gradle & Bật Build Cache
env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js + Cache npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Cài đặt Java JDK
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Cài đặt Android SDK & Bắt buộc tự động nhận License
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      # 5. [ĐÃ SỬA LỖI] Tự động nhấn "y" cho tất cả License của Android SDK
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 6. Cài đặt dependencies (npm)
      - name: Install dependencies
        run: npm ci

      # 7. Prebuild để sinh ra thư mục native /android
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # 8. Khởi tạo & Cache Gradle
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # 9. Cấp quyền thực thi cho gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 10. Build APK release
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -x lintVitalAnalyzeRelease \
            -x lintVitalReportRelease \
            --build-cache

      # 11. Upload file APK kết quả
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-release
          path: android/app/build/outputs/apk/release/*.apk