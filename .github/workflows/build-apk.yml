name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy code từ repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Cài đặt Java (JDK 17)
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # 4. Cài đặt Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Cài đặt dependencies
      - name: Install dependencies
        run: npm install

      # 6. Prebuild Android project
      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      # 7. Cấp quyền thực thi cho gradlew
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 8. Build APK
      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease -PenableSeparateBuildPerCPUArchitecture=true

      # 9. Upload TẤT CẢ file APK tìm thấy trong thư mục release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apks
          path: android/app/build/outputs/apk/release/*.apk